name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a PR branch updates only fire once).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Cache uv wheels/venv between runs (default on hosted runners; pinned here
          # so self-hosted forks keep it too).
          enable-cache: true
      # oxlint/tsgolint/anti-slop toolchain for lint-viewer.sh + lint-webmod.sh;
      # key hashes the scripts that pin those versions, so a bump invalidates it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/realearth/oxlint-standards
          key: oxlint-standards-${{ runner.os }}-${{ hashFiles('scripts/lint-viewer.sh', 'scripts/lint-webmod.sh') }}
          restore-keys: |
            oxlint-standards-${{ runner.os }}-
      # C# analysis gate. The RealEarth mod DLL itself needs the proprietary
      # game DLLs (Assembly-CSharp / UnityEngine.CoreModule) as references and
      # can only be built on a machine with the game installed (see
      # AGENTS.md "Build / install"); stubs would manufacture false confidence.
      # NetworkProtocolInspector builds standalone against NuGet Mono.Cecil and
      # runs with TreatWarningsAsErrors + analyzers on, so CI still compiles
      # and analyzer-gates what can be compiled here.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      - run: dotnet build tools/network_protocol_inspector/NetworkProtocolInspector.csproj -c Release
      - run: shellcheck scripts/*.sh
      - run: make test-fast
      - run: make -C tools lint
      # The lint scripts run oxlint, tsc and vnu through bunx at pinned
      # versions; the runner preinstalls node, but not bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bash scripts/lint-viewer.sh
      - run: bash scripts/lint-webmod.sh

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tools
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: make coverage
      - run: cd tools && uv run --extra dev python ../scripts/coverage_badge.py "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
