name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a PR branch updates only fire once).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    # Bound a hung step (network stall, deadlocked test) instead of burning
    # the 6-hour hosted-runner default; release.yml bounds its job the same way.
    timeout-minutes: 30
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Pin the uv binary itself (the action otherwise installs whatever
          # is latest at run time). Matches tools/pyproject.toml
          # required-version; bump both together.
          version: "0.12.6"
          # Cache uv wheels/venv between runs (default on hosted runners; pinned here
          # so self-hosted forks keep it too).
          enable-cache: true
      # oxlint/tsgolint/anti-slop/vnu toolchain for the lint-*.sh scripts;
      # key hashes the shared pin file plus the scripts that consume it, so a
      # version bump invalidates it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/realearth/oxlint-standards
          key: oxlint-standards-${{ runner.os }}-${{ hashFiles('scripts/toolchain-versions.env', 'scripts/lint-viewer.sh', 'scripts/lint-webmod.sh', 'scripts/lint-html.sh') }}
          restore-keys: |
            oxlint-standards-${{ runner.os }}-
      # C# analysis gate. The RealEarth mod DLL itself needs the proprietary
      # game DLLs (Assembly-CSharp / UnityEngine.CoreModule) as references and
      # can only be built on a machine with the game installed (see
      # AGENTS.md "Build / install"); stubs would manufacture false confidence.
      # NetworkProtocolInspector builds standalone against NuGet Mono.Cecil and
      # runs with TreatWarningsAsErrors + analyzers on, so CI still compiles
      # and analyzer-gates what can be compiled here.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      - run: dotnet build tools/network_protocol_inspector/NetworkProtocolInspector.csproj -c Release
      - run: shellcheck scripts/*.sh
      # Restore is only a backup if it has been proven: roundtrip drill on
      # synthetic state (sandboxed, no game install needed).
      - run: make artifacts-drill
      - run: make test-fast
      - run: make -C tools lint
      # The lint scripts install oxlint, tsc and vnu into a shared cache at
      # pinned versions; the runner preinstalls node and java, but not bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin the bun runtime (bunx resolves esbuild/tsc/oxlint through it);
          # unpinned, every CI run picks up whatever bun released that day.
          bun-version: "1.4.0"
      - run: bash scripts/lint-viewer.sh
      - run: bash scripts/lint-webmod.sh
      - run: bash scripts/lint-html.sh

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: make coverage
      - run: cd tools && uv run --locked --extra dev python ../scripts/coverage_badge.py "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
