name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce.
#
# The mod archive is deliberately NOT built here. `make package` compiles
# against the dedicated server's own assemblies, which a hosted runner does
# not have; a maintainer with a game install runs `make package`, which
# assembles dist/RealEarth/ and writes the deterministic dist/RealEarth-v*.zip
# (fixed entry order, timestamps, and permissions, plus sha256 + buildinfo
# sidecars) via scripts/package_zip.sh. Gating the tag is the half that can be
# proven automatically, and asserting the other half here would be a claim,
# not evidence.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches ModInfo.xml and the tools package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="ModInfo.xml"
          TOOLS="tools/realearth/__init__.py"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          SHIPPED="$(sed -n 's/.*<Version[^>]*value="\([^"]*\)".*/\1/p' "$MANIFEST" | head -1)"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: no <Version value=\"...\"> found in $MANIFEST" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $MANIFEST ships $SHIPPED; make them match before tagging" >&2
            exit 1
          fi
          TOOLS_VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$TOOLS" | head -1)"
          if [ -z "$TOOLS_VERSION" ]; then
            echo "ERROR: no __version__ found in $TOOLS" >&2
            exit 1
          fi
          if [ "$TOOLS_VERSION" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $TOOLS ships $TOOLS_VERSION; make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches $MANIFEST ($SHIPPED) and $TOOLS ($TOOLS_VERSION)"

      # A tag without a dated CHANGELOG heading releases notes nobody wrote.
      - name: Check CHANGELOG.md has a released entry for the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \\[${TAG}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no '## [$TAG] - YYYY-MM-DD' heading; write the release notes before tagging" >&2
            exit 1
          fi
          echo "ok: CHANGELOG.md has a released entry for $TAG"
