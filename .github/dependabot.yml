# Dependency surfaces: the mod DLL references NuGet packages, the offline
# pipeline ships tools/uv.lock, and the SHA-pinned CI actions are the third
# surface.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /Source/RealEarth
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
