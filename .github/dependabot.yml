# Dependency surfaces: the mod DLL and the standalone inspector reference
# NuGet packages (engine_patcher links the game-shipped Mono.Cecil and has no
# PackageReference), the offline pipeline ships tools/uv.lock, and the
# SHA-pinned CI actions are the third surface.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /Source/RealEarth
      - /tools/network_protocol_inspector
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
