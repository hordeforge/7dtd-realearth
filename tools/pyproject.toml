[project]
name = "realearth-tools"
version = "0.1.0"
description = "Offline pipeline: real-world Earth data → 7 Days to Die RealEarth tiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "httpx>=0.27",
  "click>=8.1",
  "pydantic>=2.0",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
gis = ["rasterio>=1.3", "geopandas>=1.0"]

[project.scripts]
realearth = "realearth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realearth"]

[tool.ruff]
line-length = 100
target-version = "py311"
