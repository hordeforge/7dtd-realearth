[project]
name = "realearth-tools"
description = "Offline pipeline: real-world Earth data → 7 Days to Die RealEarth tiles"
readme = "README.md"
requires-python = ">=3.11"
# Single source of truth for the version is realearth/__init__.py (__version__),
# resolved by hatchling at build time so the two cannot disagree.
dynamic = ["version"]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "httpx>=0.27",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "coverage>=7.6"]
gis = ["rasterio>=1.3"]
# Live Assembly-CSharp.dll metadata audit (`realearth engine-audit`); without
# it the audit falls back to documented 3.0.1 defaults.
audit = ["dnfile>=0.5"]

[project.scripts]
realearth = "realearth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "realearth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["realearth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 enforces the 100-column cap; B is bug-prone patterns (zip strict,
# loop-variable closures); I/SIM/C4/UP keep style mechanical and current.
# All groups proven clean over realearth/ + tests/ before enabling.
# PLE/PLW are the pylint error/warning subsets (defect classes); SLF bans
# touching other modules' privates; PGH bans blanket `# noqa` / `# type:
# ignore` without a rule code; T10 catches debugger/breakpoint imports.
# RUF100 fails any noqa whose rule is not enabled or not triggered, so a
# suppression cannot silently outlive its finding.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
extend-select = ["RUF100", "PLE", "PLW", "SLF", "PGH", "T10"]
