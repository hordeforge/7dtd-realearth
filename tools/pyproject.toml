[project]
name = "realearth-tools"
description = "Offline pipeline: real-world Earth data → 7 Days to Die RealEarth tiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Single source of truth for the version is realearth/__init__.py (__version__),
# resolved by hatchling at build time so the two cannot disagree.
dynamic = ["version"]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "httpx>=0.27",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "coverage>=7.6", "black>=24.3", "mypy>=1.10"]
gis = ["rasterio>=1.3"]
# Live Assembly-CSharp.dll metadata audit (`realearth engine-audit`); without
# it the audit falls back to documented 3.0.1 defaults.
audit = ["dnfile>=0.5"]

[project.scripts]
realearth = "realearth.cli:main"

[project.urls]
Homepage = "https://github.com/hordeforge/7dtd-realearth"
Changelog = "https://github.com/hordeforge/7dtd-realearth/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Build-toolchain gate: uv older than this cannot be trusted with the
# tools/uv.lock revision (lockfile format revisions move across uv releases).
# CI pins the exact version; this floor guards host machines.
required-version = ">=0.12"

[tool.hatch.version]
path = "realearth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["realearth"]

[tool.hatch.build.targets.sdist]
# The C# patcher projects ship inside the mod package (Tools/) via
# scripts/package_mod.sh; they are not Python sources, so keep them out of the
# sdist.
exclude = ["engine_patcher", "network_protocol_inspector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 enforces the 100-column cap; B is bug-prone patterns (zip strict,
# loop-variable closures); I/SIM/C4/UP keep style mechanical and current.
# All groups proven clean over realearth/ + tests/ before enabling.
# PLE/PLW are the pylint error/warning subsets (defect classes); SLF bans
# touching other modules' privates; PGH bans blanket `# noqa` / `# type:
# ignore` without a rule code; T10 catches debugger/breakpoint imports.
# RUF100 fails any noqa whose rule is not enabled or not triggered, so a
# suppression cannot silently outlive its finding.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
extend-select = ["RUF100", "PLE", "PLW", "SLF", "PGH", "T10"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# No python_version pin: mypy would then parse the installed numpy stubs under
# older syntax rules and fail on them. ruff target-version guards 3.11 syntax.
strict = true
# numpy's stubs type ufunc and .astype results as Any, so warn_return_any fires
# on correct array code across every module here. The rest of strict stays on:
# untyped defs, bare generics and implicit Optional are still errors.
warn_return_any = false

[[tool.mypy.overrides]]
# rasterio (gis extra) and dnfile (audit extra) are optional and ship no stubs.
# Both are imported inside the functions that need them and guarded there.
module = ["rasterio.*", "dnfile.*"]
ignore_missing_imports = true
